env:
  contexts:
    - name: "WebForge Local Context"
      urls:
        - "http://localhost:3000"
      includePaths:
        - "http://localhost:3000/.*"
      excludePaths:
        - "http://localhost:3000/api/auth/logout"
jobs:
  - type: spider
    parameters:
      maxDuration: 5
      url: "http://localhost:3000"
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "reports/security"
      reportFile: "zap-security-report.json"
