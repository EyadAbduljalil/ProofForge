name: ProofForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: proofforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }} - Node.js ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Repository integrity
        run: npm run integrity

      - name: ProofForge initialization
        run: npm run proofforge

      - name: System Doctor diagnostic
        run: node bin/proofforge.js doctor

      - name: Skills validation
        run: node bin/proofforge.js skills validate

      - name: CLI integration tests
        run: node tests/cli/cli.test.js

      - name: Skills benchmark
        run: npm run benchmark:skills

      - name: Realistic scenarios benchmark
        run: npm run benchmark:scenarios

      - name: Release metadata parity
        run: npm run validate:metadata

      - name: Multi-skill orchestration scenarios
        run: npm run test:orchestration

      - name: Multi-skill end-to-end execution
        run: npm run test:multi-skill-exec

      - name: Agent A/B effectiveness benchmark
        run: npm run benchmark:effectiveness

      - name: Record release evidence for commit
        run: node bin/record-evidence.js

      - name: Deterministic release gate
        run: npm run release:gate

      - name: Full regression
        run: npm test

      - name: Upload release evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofforge-evidence-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            docs/release/
            .webforge/decisions/
            TRACEABILITY_MATRIX.md
